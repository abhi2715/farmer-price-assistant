# One command: `docker compose up --build`
#   web (PWA)  http://localhost:3000     API docs  http://localhost:8000/docs     MLflow  http://localhost:5001
# First boot runs `init`: migrations -> seed (synthetic or live) -> train/backtest -> forecasts -> matching -> alerts (~2-3 min).
x-backend: &backend
  build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
  env_file: [.env.example]
  environment: &env
    DATABASE_URL: postgresql+psycopg://agriroute:agriroute@db:5432/agriroute
    REDIS_URL: redis://redis:6379/0
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_DIR: /data/models
    REPORT_DIR: /data/reports
    CORS_ORIGINS: http://localhost:3000,http://localhost:8000
  volumes: [ml_data:/data]
  restart: unless-stopped

services:
  db:
    image: postgres:16.6-alpine
    environment: { POSTGRES_USER: agriroute, POSTGRES_PASSWORD: agriroute, POSTGRES_DB: agriroute }
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agriroute"], interval: 5s, timeout: 3s, retries: 20 }
    ports: ["5432:5432"]
    restart: unless-stopped

  redis:  # Valkey: BSD-licensed, Redis-protocol compatible
    image: valkey/valkey:8.0.1-alpine
    healthcheck: { test: ["CMD", "valkey-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    volumes: [mlflow_data:/mlflow]
    ports: ["5001:5000"]
    restart: unless-stopped

  init:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.scripts.bootstrap"
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mlflow: { condition: service_started }

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      init: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: celery -A app.worker.celery worker -l info --concurrency 2
    healthcheck: { disable: true }
    depends_on:
      init: { condition: service_completed_successfully }

  beat:
    <<: *backend
    command: celery -A app.worker.celery beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck: { disable: true }
    depends_on:
      init: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile }
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pg_data:
  ml_data:
  mlflow_data:
