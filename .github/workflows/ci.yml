name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16.6-alpine
        env: { POSTGRES_USER: agriroute, POSTGRES_PASSWORD: agriroute, POSTGRES_DB: agriroute_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agriroute" --health-interval 5s --health-timeout 3s --health-retries 20
    strategy:
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "**/requirements*.txt" }
      - run: sudo apt-get install -y libgomp1
      - run: pip install -r backend/requirements.txt -r ml/requirements.txt -r backend/requirements-dev.txt && pip install -e ml
      - name: Lint
        run: ruff check backend ml
      - name: Tests (${{ matrix.db }})
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://agriroute:agriroute@localhost:5432/agriroute_test' || '' }}
          TEST_ENABLE_PROPHET: ${{ matrix.db == 'sqlite' && 'true' || 'false' }}
        run: |
          [ -z "$TEST_DATABASE_URL" ] && unset TEST_DATABASE_URL
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Bundle budget (first-load JS per route < 130 kB)
        run: |
          total=$(du -sk out/_next/static/chunks | cut -f1)
          echo "static chunks: ${total} kB"; test "$total" -lt 900

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Boot stack and smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 90); do curl -fsS localhost:3000/health && break; sleep 5; done
          curl -fsS localhost:3000/api/v1/crops | head -c 200
          docker compose logs init | tail -20
      - if: always()
        run: docker compose down -v
